<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganadores - Rifas Doble Cero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // <--- IMPORTANT: Enable class-based dark mode
            theme: {
                extend: {
                    colors: {
                        // Esto hará que cuando uses 'green-300' se vea como el nuevo logo
                        green: {
                            150: '#007b4e', // Verde oscuro (profesional)
                        },
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>

<body
    class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-[Montserrat] transition-colors duration-300">

    <nav class="bg-white dark:bg-black py-4 px-6 shadow-lg mb-8 transition-colors duration-300">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center gap-2">
                <img src="img/logo00iso.png" alt="Logo" class="h-10 w-10">
                <span class="text-xl font-extrabold text-green-600 dark:text-green-150">Doble Cero</span>
            </a>
            <div class="flex items-center gap-4">
                <!-- Theme Toggle Button -->
                <button id="theme-toggle" onclick="toggleTheme()"
                    class="p-2 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-yellow-400 transition-all hover:scale-110 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <i id="theme-toggle-icon" class="fas fa-sun"></i>
                </button>
                <a href="/"
                    class="text-gray-600 dark:text-gray-300 hover:text-green-600 dark:hover:text-green-150 font-bold transition-colors">Volver
                    al Inicio</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 max-w-6xl">
        <h1 class="text-4xl font-extrabold text-center text-green-600 dark:text-green-400 mb-12 transition-colors">
            Nuestros Ganadores 🎉</h1>

        <div id="ganadores-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
        </div>
    </main>

    <!-- Import Theme Logic -->
    <script src="theme.js"></script>

    <script>
        // --- CONFIGURACIÓN DE API ---
        const API = window.location.hostname.includes('doblecerove.com')
            ? 'https://doble-cero.onrender.com'
            : 'https://doble-cero-staging.onrender.com';

        // --- HELPERS DE FORMATO ---
        function formatTicketNumber(number, totalNumbers) {
            if (!totalNumbers) return String(number);
            const padding = String(totalNumbers).length;
            return String(number).padStart(padding, '0');
        }

        function formatName(name) {
            if (!name) return '';
            return name.trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
        }

        // --- FUNCIÓN PRINCIPAL ---
        async function cargarGanadores() {
            const container = document.getElementById('ganadores-container');
            container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">Cargando historial...</div>';

            try {
                const res = await fetch(`${API}/api/raffles`);
                const rifas = await res.json();

                // Filtramos solo las que tienen ganadores cargados Y están finalizadas
                const finalizadas = rifas.filter(r =>
                    r.winners &&
                    r.winners.length > 0 &&
                    (r.status === 'finalizada' || r.isFinished === true)
                );

                if (finalizadas.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">Aún no hay rifas finalizadas. ¡Sé tú el próximo ganador!</div>';
                    return;
                }

                // Generamos el HTML de las tarjetas
                container.innerHTML = finalizadas.map(rifa => `
                    <div class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden shadow-xl dark:shadow-2xl border border-gray-200 dark:border-white/5 flex flex-col h-full transition-colors duration-300">
                        <div class="relative">
                            <img src="${rifa.image}" class="w-full h-48 object-cover opacity-90 dark:opacity-50 transition-opacity">
                            <div class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center bg-black/30 dark:bg-transparent">
                                <h2 class="text-2xl font-bold text-white drop-shadow-md">${rifa.title}</h2>
                                <span class="bg-green-500 text-white dark:text-black px-4 py-1 rounded-full text-sm font-black mt-2 shadow-lg">
                                    ${rifa.isDelivered ? '✅ PREMIO ENTREGADO' : '⏳ EN PROCESO DE ENTREGA'}
                                </span>
                            </div>
                        </div>

                        <div class="p-6 flex-1 flex flex-col">
                            <div class="flex gap-3 mb-6">
                                ${rifa.lotteryResultImages && rifa.lotteryResultImages.length > 0
                        ? rifa.lotteryResultImages.map(img => `
                                        <div class="flex-1">
                                            <p class="text-[10px] text-gray-500 dark:text-gray-400 mb-1 text-center uppercase tracking-wider font-bold">Resultado Oficial</p>
                                            <img src="${img}" class="rounded-lg border border-gray-300 dark:border-green-500/30 cursor-pointer hover:scale-105 transition aspect-video object-cover shadow-sm" onclick="window.open('${img}')">
                                        </div>
                                    `).join('')
                        : '<div class="w-full py-4 text-center text-gray-400 dark:text-gray-600 border border-dashed border-gray-300 dark:border-gray-700 rounded-lg text-sm italic font-mono">Esperando capturas oficiales...</div>'
                    }
                            </div>

                            <div class="space-y-3">
                                ${rifa.winners.sort((a, b) => a.place - b.place).map(w => {
                        const isTopBuyer = (w.place === 2);
                        // Light: bg-blue-50 border-blue-200 | Dark: bg-blue-500/5 border-blue-500
                        const colorClass = isTopBuyer
                            ? 'border-blue-300 dark:border-blue-500 bg-blue-50 dark:bg-blue-500/5'
                            : 'border-green-300 dark:border-green-400 bg-green-50 dark:bg-green-400/5';

                        const labelColor = isTopBuyer ? 'text-blue-600 dark:text-blue-400' : 'text-green-700 dark:text-green-400';
                        const labelText = isTopBuyer ? '🏆 Máximo Comprador' : '🥇 Ganador 1er Premio';

                        return `
                                    <div class="rounded-xl p-4 border-l-4 ${colorClass} transition-colors">
                                        <p class="${labelColor} text-[10px] font-black uppercase mb-1 tracking-widest">${labelText}</p>
                                        <div class="flex justify-between items-center gap-2">
                                            <div class="min-w-0 flex-1">
                                                <p class="text-lg font-bold text-gray-900 dark:text-white truncate">
                                                    ${formatName(w.firstName)} ${formatName(w.lastName)}
                                                </p>
                                                <p class="text-gray-500 dark:text-gray-400 text-xs font-medium">
                                                    ${isTopBuyer
                                ? `Tickets comprados: <span class="text-blue-600 dark:text-blue-400 font-mono font-black text-sm">${w.number || '0'}</span>`
                                : `Número ganador: <span class="text-green-600 dark:text-green-300 font-mono font-black text-sm">${formatTicketNumber(w.number, rifa.totalNumbers)}</span>`
                            }
                                                </p>
                                            </div>
                                            <div class="text-right shrink-0">
                                                <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase">Sorteado:</p>
                                                <p class="text-xs font-bold text-gray-600 dark:text-gray-300">
                                                    ${new Date(rifa.drawDate).toLocaleDateString()}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                    `;
                    }).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="col-span-full text-center py-10 text-red-500 dark:text-red-400">Error conectando con el servidor.</div>';
            }
        }

        // Ejecutar al cargar la página
        window.onload = cargarGanadores;
    </script>
</body>

</html>
